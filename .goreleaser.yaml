# GoReleaser configuration.
# Docs: https://goreleaser.com  —  run `goreleaser check` to validate.
version: 2

project_name: elgato

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publish a Homebrew cask into the tap repo on every tagged release.
# (Homebrew now prefers casks over formulae for pre-built binaries; casks are
# macOS-only, which suits this tool.) Requires a Personal Access Token with
# contents:write on github.com/arventures/homebrew-elgato, as TAP_GITHUB_TOKEN.
homebrew_casks:
  - name: elgato
    binaries:
      - elgato
    repository:
      owner: arventures
      name: homebrew-elgato
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/arventures/elgato"
    description: "Control Elgato Key Lights from Apple Home and the command line"
    commit_author:
      name: goreleaser-bot
      email: goreleaser@users.noreply.github.com
    # Homebrew runs `elgato completion <shell>` during install and installs the
    # bash, zsh and fish scripts it prints.
    generate_completions_from_executable:
      executable: elgato
      shell_parameter_format: cobra
      shells: [bash, zsh, fish]
    # The binary is not code-signed/notarized, so strip the quarantine flag on
    # install to avoid "elgato is damaged and can't be opened" from Gatekeeper.
    # It must be a *pre*flight step: Homebrew generates the completions above
    # before any postflight step, whatever the stanza order, and macOS blocks
    # the still-quarantined binary (goreleaser/goreleaser#6593).
    # Homebrew deprecated Ruby `preflight` blocks (what hooks.pre.install
    # writes) for the declarative `preflight_steps` stanza. GoReleaser only
    # writes that from v2.19 (hooks.pre.install_steps), so add it as a custom
    # block until then. The {{ "..." }} wrapper keeps Homebrew's own
    # {{staged_path}} token intact through GoReleaser's templating.
    custom_block: |
      preflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/elgato"]
        end
      end
